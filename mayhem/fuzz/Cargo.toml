[package]
name = "png-mayhem-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }

[dependencies.png]
path = "../.."

# Keep this out of the parent crate's build; it is its own workspace root.
[workspace]
members = ["."]

[profile.release]
debug = 1

# Decode with the arithmetic a release build of `png` has: wrapping, not panicking. With overflow
# checks the unchecked frame size panics on `BASE` and on `FIX` alike (the error path of the fixed
# check still computes it), hiding what the fix changes.
[profile.release.package.png]
overflow-checks = false

[[bin]]
name = "next_frame"
path = "fuzz_targets/next_frame.rs"
test = false
doc = false
